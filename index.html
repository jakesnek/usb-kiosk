<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
  <title>USB Kiosk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">


</head>

<body>
  <div id="main">
    <div id="infoBar">
      <span id="currentFileName">No file selected</span>
    </div>

    <div id="viewer">
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
        </svg>
        <p>Select a file to view</p>
        <span>Open the sidebar to browse USB drives</span>
      </div>
    </div>
    <div id="tabDots">
      <button class="tab-dot active" data-tab="Videos" title="Videos"><i class="bi bi-film"></i></button>
      <button class="tab-dot" data-tab="Images" title="Images"><i class="bi bi-image"></i></button>
      <button class="tab-dot" data-tab="Documents" title="Documents"><i class="bi bi-file-earmark-text"></i></button>
    </div>
    <div class="offcanvas offcanvas-start offcanvas-custom-color" tabindex="-1" id="offcanvasBar"
      aria-labelledby="offcanvasExampleLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasExampleLabel">File Browser</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <div class="sidebar-label">Choose which file to open:</div>
        <div id="driveContainer"></div>
      </div>
    </div>

    <div id="iconStrip">
      <button class="icon-strip-btn" data-tab="Videos" title="Videos">
        <i class="bi bi-film"></i>
      </button>
      <button class="icon-strip-btn" data-tab="Images" title="Images">
        <i class="bi bi-image"></i>
      </button>
      <button class="icon-strip-btn" data-tab="Documents" title="Documents">
        <i class="bi bi-file-earmark-text"></i>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <script type="module">
    import * as pdfjsLib from './public/pdfjs/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      new URL('./public/pdfjs/pdf.worker.min.mjs', import.meta.url).toString();
      
    window.pdfjsLib = pdfjsLib;
  </script>

  <script src="renderer.js"></script>
</body>

</html>
